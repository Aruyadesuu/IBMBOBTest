<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>TestGen Agent</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #647087;
      --line: #e4e9f1;
      --accent: #5546d7;
    }

    * { box-sizing: border-box; }

    body { margin: 0; min-width: 320px; }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 38px);
      letter-spacing: -.04em;
    }

    .intro {
      margin: 10px 0 28px;
      color: var(--muted);
      line-height: 1.6;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 32px rgb(24 39 75 / 5%);
    }

    label, .section-title {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      padding: 14px 15px;
      border: 1px solid #d5dce8;
      border-radius: 10px;
      outline: none;
      color: inherit;
      background: #fff;
      font: inherit;
      line-height: 1.55;
      resize: vertical;
      transition: border-color .15s, box-shadow .15s;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(85 70 215 / 13%);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 9px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;
    }

    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid rgb(85 70 215 / 25%); outline-offset: 2px; }

    .primary { color: #fff; background: var(--accent); }
    .primary:hover { background: #4537c2; }
    .secondary { color: #344057; border-color: var(--line); background: #fff; }
    .secondary:hover:not(:disabled) { background: #f7f8fc; border-color: #cbd3e0; }
    button:disabled { opacity: .48; cursor: not-allowed; }

    .status {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .status.error { color: #b42318; }
    .results { margin-top: 30px; }

    .results-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .results-heading .section-title { margin: 0; font-size: 17px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 11px; }
    table { width: 100%; min-width: 980px; border-collapse: collapse; text-align: left; }

    th, td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: 13px;
      line-height: 1.5;
    }

    th {
      color: #536078;
      background: #f8f9fc;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody tr:last-child td { border-bottom: 0; }
    td { white-space: pre-line; }
    td:first-child { color: #4a3cc7; font-weight: 750; white-space: nowrap; }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      color: #48566e;
      background: #eef1f6;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 600px) {
      main { width: min(100% - 24px, 1120px); padding-top: 30px; }
      .panel { padding: 18px; }
      .actions { align-items: stretch; flex-direction: column; }
      .actions button { width: 100%; }
      .results-heading { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">QA Test Case Generator</p>
    <h1>TestGen Agent</h1>
    <p class="intro">Ubah requirement menjadi test case terstruktur. Generasi dilakukan langsung di browser dengan aturan sederhana.</p>

    <section class="panel" aria-labelledby="input-label">
      <label id="input-label" for="requirement">Requirement / user story</label>
      <textarea id="requirement" spellcheck="true">Fitur: Login
- User login memakai email dan password.
- Password minimal 8 dan maksimal 20 karakter.
- Setelah 3x gagal login, akun terkunci selama 15 menit.</textarea>
      <div class="actions">
        <button class="primary" id="generate" type="button">Generate Test Case</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="results" aria-labelledby="results-title">
      <div class="results-heading">
        <h2 class="section-title" id="results-title">Hasil Test Case</h2>
        <button class="secondary" id="copy" type="button" disabled>Copy</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Kategori</th>
              <th scope="col">Skenario</th>
              <th scope="col">Langkah</th>
              <th scope="col">Data Uji</th>
              <th scope="col">Expected Result</th>
              <th scope="col">Prioritas</th>
            </tr>
          </thead>
          <tbody id="results">
            <tr><td class="empty" colspan="7">Test case akan tampil di sini.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const requirementInput = document.getElementById("requirement");
    const resultsBody = document.getElementById("results");
    const statusMessage = document.getElementById("status");
    const copyButton = document.getElementById("copy");
    let generatedCases = [];

    function findPasswordRange(text) {
      const minimum = text.match(/(?:minimal|minimum|min)\s*(\d+)\s*(?:karakter|char(?:acter)?s?)?/i);
      const maximum = text.match(/(?:maksimal|maximum|max)\s*(\d+)\s*(?:karakter|char(?:acter)?s?)?/i);
      if (minimum && maximum) return { min: Number(minimum[1]), max: Number(maximum[1]) };

      const range = text.match(/password.{0,40}?(\d+)\s*(?:-|–|sampai)\s*(\d+)\s*karakter/i);
      return range ? { min: Number(range[1]), max: Number(range[2]) } : null;
    }

    function findLockoutRule(text) {
      const attempts = text.match(/(?:setelah\s*)?(\d+)\s*(?:x|kali)\s*gagal/i);
      const duration = text.match(/(?:terkunci|dikunci)\s*(?:selama\s*)?(\d+)\s*menit/i);
      if (!attempts || !duration) return null;
      return { attempts: Number(attempts[1]), minutes: Number(duration[1]) };
    }

    function createTestCases(text) {
      const cases = [];
      const add = (category, scenario, steps, data, expected, priority) => {
        cases.push({ id: `TC-${String(cases.length + 1).padStart(3, "0")}`, category, scenario, steps, data, expected, priority });
      };
      const hasLogin = /login|masuk/i.test(text);
      const passwordRange = findPasswordRange(text);
      const lockout = findLockoutRule(text);

      if (hasLogin) {
        add("Positive", "Login dengan kredensial valid",
          "1. Masukkan email dan password valid.\n2. Klik Login.",
          "Email valid; password benar",
          "Login berhasil dan sesi pengguna aktif.", "High");
        add("Negative", "Login dengan password salah",
          "1. Masukkan email terdaftar dan password yang salah.\n2. Klik Login.",
          "Email valid; password salah",
          "Login ditolak dan sesi pengguna tidak dibuat.", "High");
      }

      if (passwordRange && passwordRange.min > 0 && passwordRange.max >= passwordRange.min) {
        const { min, max } = passwordRange;
        if (min > 1) {
          add("Boundary", "Password satu karakter di bawah batas minimum",
            "1. Masukkan kredensial dengan password di bawah batas minimum.\n2. Klik Login.",
            `Password ${min - 1} karakter`,
            `Login ditolak karena password kurang dari ${min} karakter; sesi tidak dibuat.`, "High");
        }
        add("Boundary", "Password tepat pada batas minimum",
          "1. Masukkan kredensial dengan password pada batas minimum.\n2. Klik Login.",
          `Password benar ${min} karakter`,
          "Login berhasil.", "High");
        if (max !== min) {
          add("Boundary", "Password tepat pada batas maksimum",
            "1. Masukkan kredensial dengan password pada batas maksimum.\n2. Klik Login.",
            `Password benar ${max} karakter`,
            "Login berhasil.", "High");
          add("Boundary", "Password satu karakter di atas batas maksimum",
            "1. Masukkan kredensial dengan password melebihi batas maksimum.\n2. Klik Login.",
            `Password ${max + 1} karakter`,
            `Login ditolak karena password melebihi ${max} karakter; sesi tidak dibuat.`, "High");
        }
      }

      if (hasLogin && lockout) {
        add("Edge", `Akun terkunci setelah ${lockout.attempts} kegagalan berturut-turut`,
          `1. Coba login dengan password salah sebanyak ${lockout.attempts} kali berturut-turut.\n2. Amati hasil percobaan terakhir.`,
          "Email terdaftar; password salah",
          `Setelah kegagalan ke-${lockout.attempts}, akun terkunci selama ${lockout.minutes} menit.`, "High");
        add("Edge", "Login benar ditolak selama akun terkunci",
          "1. Kunci akun dengan kegagalan berulang.\n2. Sebelum masa lockout berakhir, coba login dengan kredensial benar.",
          "Email dan password benar; waktu sejak lockout < " + lockout.minutes + " menit",
          "Login ditolak dan sesi tidak dibuat selama akun terkunci.", "High");
        add("Edge", "Login diizinkan setelah masa lockout berakhir",
          "1. Kunci akun dengan kegagalan berulang.\n2. Tunggu hingga masa lockout berakhir.\n3. Login dengan kredensial benar.",
          "Email dan password benar; waktu sejak lockout ≥ " + lockout.minutes + " menit",
          "Akun tidak lagi terkunci dan login berhasil.", "High");
      }

      if (hasLogin && cases.length === 0) {
        add("Positive", "Login dengan kredensial valid",
          "1. Masukkan email dan password valid.\n2. Klik Login.",
          "Email valid; password benar",
          "Login berhasil dan sesi pengguna aktif.", "High");
      }
      return cases;
    }

    function renderCases(cases) {
      resultsBody.replaceChildren();
      if (cases.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 7;
        cell.className = "empty";
        cell.textContent = "Requirement tidak memuat aturan yang dikenali untuk menghasilkan test case.";
        row.append(cell);
        resultsBody.append(row);
        return;
      }

      for (const testCase of cases) {
        const row = document.createElement("tr");
        const values = [testCase.id, testCase.category, testCase.scenario, testCase.steps, testCase.data, testCase.expected, testCase.priority];
        values.forEach((value, index) => {
          const cell = document.createElement("td");
          if (index === 1) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = value;
            cell.append(badge);
          } else {
            cell.textContent = value;
          }
          row.append(cell);
        });
        resultsBody.append(row);
      }
    }

    function generate() {
      const text = requirementInput.value.trim();
      statusMessage.classList.remove("error");
      if (!text) {
        generatedCases = [];
        renderCases(generatedCases);
        copyButton.disabled = true;
        statusMessage.textContent = "Masukkan requirement terlebih dahulu.";
        statusMessage.classList.add("error");
        return;
      }

      generatedCases = createTestCases(text);
      renderCases(generatedCases);
      copyButton.disabled = generatedCases.length === 0;
      statusMessage.textContent = generatedCases.length
        ? `${generatedCases.length} test case berhasil dibuat.`
        : "Tidak ada aturan login, batas password, atau lockout yang dikenali.";
    }

    function toTabSeparated(cases) {
      const headers = ["ID", "Kategori", "Skenario", "Langkah", "Data Uji", "Expected Result", "Prioritas"];
      return [headers, ...cases.map(testCase => [
        testCase.id, testCase.category, testCase.scenario, testCase.steps,
        testCase.data, testCase.expected, testCase.priority
      ])].map(row => row.map(value => String(value).replace(/\t/g, " ")).join("\t")).join("\n");
    }

    async function copyCases() {
      if (!generatedCases.length) return;
      const value = toTabSeparated(generatedCases);
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
        } else {
          const temporary = document.createElement("textarea");
          temporary.value = value;
          temporary.setAttribute("readonly", "");
          temporary.style.position = "fixed";
          temporary.style.opacity = "0";
          document.body.append(temporary);
          temporary.select();
          const copied = document.execCommand("copy");
          temporary.remove();
          if (!copied) throw new Error("Perintah salin tidak berhasil.");
        }
        statusMessage.classList.remove("error");
        statusMessage.textContent = "Test case berhasil disalin.";
      } catch (error) {
        statusMessage.classList.add("error");
        statusMessage.textContent = `Gagal menyalin test case: ${error.message}`;
      }
    }

    document.getElementById("generate").addEventListener("click", generate);
    copyButton.addEventListener("click", copyCases);
    generate();
  </script>
</body>
</html>
